[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard"
version = "0.1.0"
description = "A local-first AI coding agent"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "cairosvg>=2.9.1",
    "chroma>=0.2.0",
    "ddgs>=9.16.1",
    "fastmcp>=4.1.3",
    "flagembedding>=1.4.2",
    "langchain[mcp]>=1.4.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.17",
    "pillow>=13.0.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "rich>=15.0.0",
    "rich-pixels>=3.0.1",
    "sentence-transformers>=6.2.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
repoguard = "cli.commands:app"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "llm*", "agent*", "memory*", "rag*", "tools*", "config*", "mcp_servers*"]

[tool.setuptools.package-data]
llm = ["prompt_templates/*.md"]
